def args = ["-Xlint:deprecation"]

group 'com.eyedeadevelopment.fluttertts'
version '1.0-SNAPSHOT'

// Only used when this plugin's Android project is built on its own. Inside an
// app, the app's settings.gradle decides the Android Gradle Plugin version.
buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:9.3.1'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.4.20'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

project.getTasks().withType(JavaCompile).configureEach {
    options.compilerArgs.addAll(args)
}

// No Kotlin Gradle Plugin here: with AGP 9's built-in Kotlin the Android plugin
// compiles the Kotlin sources itself, and when an app turns built-in Kotlin off
// (android.builtInKotlin=false, or AGP 8) Flutter 3.44+ applies the Kotlin
// Gradle Plugin to the plugin projects for it.
apply plugin: 'com.android.library'

android {
    namespace = 'com.eyedeadevelopment.fluttertts'
    compileSdk = 36

    defaultConfig {
        minSdk = 24
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    lint {
        disable 'InvalidPackage'
        disable 'GradleDependency'
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11
    }
}
